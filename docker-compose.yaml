version: '3.9'

services:
  dolt-primary:
    image: dolthub/dolt-sql-server:latest
    container_name: dolt-primary
    environment:
      DOLT_PASSWORD: root
    ports:
      - "3307:3306"  # exposes primary on localhost:3307
    volumes:
      - dolt_primary_data:/var/lib/dolt
    command: [
      "dolt", "sql-server",
      "--user", "root",
      "--password", "root",
      "--host", "0.0.0.0",
      "--port", "3306"
    ]

  dolt-replica:
    image: dolthub/dolt-sql-server:latest
    container_name: dolt-replica
    depends_on:
      - dolt-primary
    environment:
      DOLT_PASSWORD: root
    ports:
      - "3308:3306"  # exposes replica on localhost:3308
    volumes:
      - dolt_replica_data:/var/lib/dolt
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      sleep 5 && 
      dolt clone http://dolt-primary:80/default replica &&
      cd replica &&
      dolt sql-server --user root --password root --host 0.0.0.0 --port 3306
      "

volumes:
  dolt_primary_data:
  dolt_replica_data:
