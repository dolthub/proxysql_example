version: '3.9'

services:
  dolt-primary:
    image: dolthub/dolt-sql-server:latest
    container_name: dolt-primary
    # environment:
    #   DOLT_PASSWORD: root
    ports:
      - "3307:3306"  # exposes primary on localhost:3307
    volumes:
      - /Users/dustin/.dolt/creds:/root/.dolt/creds
      - dolt_primary_data:/var/lib/dolt
      - dolt_primary_dolt_config:/etc/dolt/doltcfg.d
      - dolt_primary_server_config:/etc/dolt/servercfg.d
      - ./primary-init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    command: [
      "-l", "debug",
    ]

  dolt-replica-1:
    image: dolthub/dolt-sql-server:latest
    container_name: dolt-replica-1
    # environment:
    #   DOLT_PASSWORD: root
    ports:
      - "3308:3306"  # exposes primary on localhost:3308
    volumes:
      - /Users/dustin/.dolt/creds:/root/.dolt/creds
      - dolt_replica_1_data:/var/lib/dolt
      - dolt_replica_1_dolt_config:/etc/dolt/doltcfg.d
      - dolt_replica_1_server_config:/etc/dolt/servercfg.d
      - ./replica-1-init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    command: [
      "--readonly",
      "-l", "debug",
    ]

volumes:
  dolt_primary_data:
  dolt_primary_dolt_config:
  dolt_primary_server_config:

  dolt_replica_1_data:
  dolt_replica_1_dolt_config:
  dolt_replica_1_server_config:
